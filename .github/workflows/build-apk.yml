name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -sL -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew

      - name: Build Kitchen + Customer Debug APKs
        run: |
          ./gradlew :app:assembleDebug :customer:assembleDebug --stacktrace --no-daemon

      - name: Upload Kitchen APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reyhoon-kitchen-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reyhoon-customer-apk
          path: customer/build/outputs/apk/debug/*.apk
          retention-days: 30
